[project]
name = "accessibility-screening"
version = "0.1.0"
description = "Check a page against WCAG rules and sort findings by how much they block someone."
requires-python = ">=3.9"
dependencies = ["beautifulsoup4>=4.12", "httpx>=0.27", "anthropic>=0.40"]

[project.scripts]
accessibility-screening = "accessibility_screening.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
